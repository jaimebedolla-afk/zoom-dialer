<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zoom Dialer</title>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      let phone = params.get('num');
      
      if (phone) {
        // Ensure 11 digits for North America
        if (phone.length === 10) { 
          phone = '1' + phone; 
        }
        
        // Launch native Zoom protocol inside a hidden iframe
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = 'zoomphonecall://' + phone;
        document.body.appendChild(iframe);

        // Close the tab smoothly after handoff
        setTimeout(() => {
          window.close();
        }, 1200);
      }
    };
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h2>Launching Zoom Phone...</h2>
</body>
</html>
