<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zoom Dialer</title>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const phone = params.get('num');
      if (phone) {
        // Trigger call via system TEL handler
        window.location.href = 'tel:' + phone;
        
        // Wait 2.5 seconds to allow Windows/Zoom handoff before closing tab
        setTimeout(() => {
          window.close();
        }, 2500);
      }
    };
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h2>Connecting to Zoom Phone...</h2>
  <p>If Zoom does not open automatically, <a id="manual-link" href="#">click here to dial</a>.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const phone = params.get('num');
    if (phone) {
      document.getElementById('manual-link').href = 'tel:' + phone;
    }
  </script>
</body>
</html>
