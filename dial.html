<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zoom Dialer</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 40px; background-color: #fafafa;">
  <h3 style="color: #222;">Launching Zoom Phone...</h3>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      let rawNum = params.get('num') || '';
      let cleanNum = rawNum.replace(/\D/g, '');

      if (cleanNum.length === 10) {
        cleanNum = '1' + cleanNum;
      }

      if (cleanNum) {
        // Trigger via script-generated link to bypass browser navigation drops
        const link = document.createElement('a');
        link.href = 'zoomphonecall://' + cleanNum;
        document.body.appendChild(link);
        link.click();

        // Fast 700ms handoff window before closing tab
        setTimeout(function() {
          window.close();
        }, 4500);
      }
    })();
  </script>
</body>
</html>
